name: flutter_m3_template
description: A modern Flutter app template with Material 3 design
publish_to: 'none'
version: 1.0.7+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.7.0
  path_provider: ^2.1.3
  path: ^1.9.0
  permission_handler: ^11.3.1
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_native_splash: ^2.4.0
  xml: ^6.3.0
  url_launcher: ^6.3.1
  m3e_core: ^0.1.0
  webview_flutter: ^4.10.0
  http: ^1.2.0
  archive: ^3.6.0
  open_file: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true

  image_path: "assets/logo.png"

  adaptive_icon_background: "#F3F3F3"
  
  
flutter_native_splash:
  color: "#F3F3F3"
  color_dark: "#121212"

  image: assets/logo.png

  android_12:
    image: assets/logo.png
    icon_background_color: "#F3F3F3"
    icon_background_color_dark: "#121212"